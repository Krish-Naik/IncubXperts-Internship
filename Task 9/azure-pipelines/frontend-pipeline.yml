# Frontend CI/CD - build Angular app and deploy to Azure Static Web Apps
trigger:
  branches:
    include:
      - main
      - feature/authentication
  paths:
    include:
      - Task 9/los-frontend/*

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  frontendDir: 'Task 9/los-frontend'
  azureStaticWebAppsApiToken: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
  NG_CLI_ANALYTICS: 'false'

stages:
  - stage: BuildAndDeploy
    jobs:
      - job: BuildFrontend
        timeoutInMinutes: 15
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: $(frontendDir)
            displayName: Install dependencies

          - script: |
              set +e
              timeout 300 npm run build -- --configuration production
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 124 ]; then
                echo "Build process did not exit cleanly after 300s - checking if output was actually generated..."
                if [ -d "dist/LOS-frontend/browser" ]; then
                  echo "Build output found on disk. Treating as successful despite the hang."
                  exit 0
                else
                  echo "Build output missing - this is a real failure, not just a hang."
                  exit 1
                fi
              fi
              exit $EXIT_CODE
            workingDirectory: $(frontendDir)
            displayName: Build Angular app

          - task: AzureStaticWebApp@0
            inputs:
              app_location: $(frontendDir)
              output_location: dist/LOS-frontend/browser
              azure_static_web_apps_api_token: $(azureStaticWebAppsApiToken)
              skip_app_build: true
