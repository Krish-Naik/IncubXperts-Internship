trigger:
  branches:
    include:
      - main
      - feature/authentication
  paths:
    include:
      - Task 9/los-frontend/*

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  frontendDir: 'Task 9/los-frontend'
  azureStaticWebAppsApiToken: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
  NG_CLI_ANALYTICS: 'false'

stages:
  - stage: BuildAndDeploy
    jobs:
      - job: BuildFrontend
        timeoutInMinutes: 15
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: $(frontendDir)
            displayName: Install dependencies

          - script: |
              npm run build -- --configuration production
            workingDirectory: $(frontendDir)
            displayName: Build Angular app

          - script: |
              echo "Listing build output for verification:"
              find "$(frontendDir)/dist" -maxdepth 4
              if [ -f "$(frontendDir)/dist/LOS-frontend/browser/index.html" ]; then
                echo "index.html found - build output verified."
              else
                echo "index.html NOT found - failing pipeline."
                exit 1
              fi
            displayName: Verify build output

          - task: AzureStaticWebApp@0
            inputs:
              app_location: '$(frontendDir)/dist/LOS-frontend/browser'
              output_location: ''
              skip_app_build: true
              azure_static_web_apps_api_token: $(azureStaticWebAppsApiToken)